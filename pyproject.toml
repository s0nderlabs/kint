[project]
name = "kint"
version = "0.2.0"
description = "Sibyl Memory that outlives the laptop: wallet-owned, kept on Base, verified before the agent acts on it."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "sibyl-memory-client>=0.8.1,<0.9",
    "sibyl-memory-mcp>=0.2.1,<0.3",
    "eth-account>=0.13,<0.15",
    "eth-abi>=5",
    "eth-utils>=4",
    "eth-keys>=0.5",
    "cryptography>=42",
    "web3>=7",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security :: Cryptography",
]

[project.urls]
Homepage = "https://github.com/s0nderlabs/kint"
Source = "https://github.com/s0nderlabs/kint"

[project.optional-dependencies]
dev = ["pytest>=8", "sibyl-memory-cli>=0.4.1"]

[project.scripts]
kint = "kint.cli:main"
kint-server = "kint.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kint"]

[tool.uv]
dev-dependencies = ["pytest>=8", "sibyl-memory-cli>=0.4.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: scrypt and network-bound tests", "chain: needs a live RPC"]

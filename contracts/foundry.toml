[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
via_ir = false
fs_permissions = [{ access = "read", path = "./out" }]

[rpc_endpoints]
base = "https://mainnet.base.org"

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"
